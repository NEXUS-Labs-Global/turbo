<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App shell</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--panel:#0b0b0d;--line:#2a2a31;--text:#fff;--muted:#b9b9c4;
  --accent:#8b5cf6;--rgb:139,92,246;--light:#c4b0ff;--dark:#3b1b8f;
  --fs:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000}
body{font-family:"Manrope","Segoe UI",system-ui,Arial,sans-serif;font-size:var(--fs);color:var(--text);display:flex;align-items:center;justify-content:center;padding:12px}
.window{position:relative;width:min(1100px,100%);height:min(720px,calc(100vh - 24px));background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(var(--rgb),.18);transition:box-shadow .6s}
.titlebar{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#3a3a44;display:block}
.winctl{display:flex;gap:6px}.winctl span{width:28px;height:20px;border-radius:5px;background:#16161b;display:block}
.stage{position:relative;flex:1;min-height:0}

/* плавающий фон */
.glow{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:transform 1.2s ease}
.stage[data-v="setup"] .glow{transform:scale(1.06)}
.stage[data-v="home"] .glow{transform:scale(1.12)}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.42),transparent 68%);will-change:transform}
.b1{width:560px;height:560px;right:-120px;top:-160px;animation:f1 19s ease-in-out infinite alternate}
.b2{width:480px;height:480px;left:-140px;bottom:-180px;opacity:.8;animation:f2 23s ease-in-out infinite alternate}
.b3{width:340px;height:340px;left:42%;top:30%;opacity:.5;animation:f3 29s ease-in-out infinite alternate}
@keyframes f1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-120px,90px) scale(1.12)}100%{transform:translate(-40px,160px) scale(.95)}}
@keyframes f2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,-70px) scale(1.15)}100%{transform:translate(60px,-150px) scale(.92)}}
@keyframes f3{0%{transform:translate(0,0)}50%{transform:translate(-160px,60px) scale(1.2)}100%{transform:translate(120px,-90px) scale(.9)}}
body.nodrift .blob{animation:none}

.view{position:absolute;inset:0;display:flex;opacity:0;visibility:hidden;transform:scale(.985);filter:blur(8px);transition:opacity .6s ease,transform .6s ease,filter .6s ease,visibility 0s .6s}
.view.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .6s ease .15s,transform .6s ease .15s,filter .6s ease .15s,visibility 0s}
.center{margin:auto;text-align:center;padding:24px;max-width:560px;width:100%}
.logo{display:flex;align-items:center;gap:5.2%;flex:none;width:min(520px,82%);margin:0 auto 32px;filter:drop-shadow(0 0 26px rgba(var(--rgb),.5))}
.logo svg{width:19.6%;height:auto;flex:none}
.logo img{width:75.2%;height:auto;image-rendering:pixelated}
h1{font-size:2.2em;line-height:1.15;margin:0 0 12px;font-weight:800}
h2{font-size:1.6em;margin:0 0 8px;font-weight:800}
h3{font-size:1.05em;margin:0 0 10px;font-weight:800}
p{color:var(--muted);line-height:1.55;margin:0 0 24px}
.btn{font:inherit;font-weight:800;background:#fff;color:#000;border:2px solid #fff;border-radius:12px;padding:14px 30px;min-height:52px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 0 0 4px rgba(var(--rgb),.4)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:#fff;border-color:#6b6b78}
.btn.ghost:hover{border-color:#fff}
:focus-visible{outline:3px solid var(--light);outline-offset:3px}

.setup{margin:auto;width:min(560px,92%);max-height:calc(100% - 24px);overflow:auto;background:rgba(11,11,13,.9);border:1px solid var(--line);border-radius:16px;padding:32px;backdrop-filter:blur(6px)}
.progress{display:flex;gap:8px;margin-bottom:24px}
.progress b{flex:1;height:6px;border-radius:3px;background:#2a2a31;transition:background .4s}
.progress b.done{background:var(--accent)}
.step{display:none}
.step.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.opts{display:grid;gap:12px;margin-bottom:24px}
.opt{font:inherit;text-align:left;color:#fff;background:#000;border:2px solid #3a3a44;border-radius:12px;padding:14px 18px;min-height:52px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s,background .2s}
.opt:hover{border-color:#8a8a98}
.opt[aria-checked="true"]{border-color:var(--accent);background:rgba(var(--rgb),.16)}
.opt[aria-checked="true"]::after{content:"✓";color:var(--light);font-weight:800;margin-left:auto}
.sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid #fff}
.row{display:flex;justify-content:space-between;gap:12px}

.sidebar{position:relative;width:230px;flex:none;background:rgba(11,11,13,.9);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:8px}
.sidebar .logo{width:100%;max-width:200px;margin:6px 0 20px 4px;filter:drop-shadow(0 0 12px rgba(var(--rgb),.45))}
@media (max-width:700px){.sidebar .logo img{display:none}.sidebar .logo svg{width:44px}}
.nav{position:relative;z-index:1;overflow:hidden;font:inherit;text-align:left;color:#fff;background:transparent;border:2px solid transparent;border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer;transition:transform .15s}
.nav:active{transform:scale(.97)}
.nav::before{content:"";position:absolute;inset:0;background:rgba(var(--rgb),.5);transform:scaleY(0);transform-origin:top;pointer-events:none}
.nav.press::before{animation:sweep .6s ease-out}
@keyframes sweep{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-current="page"]{font-weight:800}
.ind{position:absolute;left:14px;right:14px;top:0;height:48px;border:2px solid var(--accent);background:rgba(var(--rgb),.16);border-radius:10px;transition:transform .5s cubic-bezier(.25,.9,.3,1),height .3s;z-index:0;pointer-events:none}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.drop{animation:drop .5s cubic-bezier(.25,.9,.3,1) both}
body.calm .drop{animation:none}
[hidden]{display:none!important}
.social{display:grid;gap:12px;margin-bottom:18px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:12px;font:inherit;font-weight:800;background:#fff;color:#000;border:2px solid #fff;border-radius:12px;padding:12px 20px;min-height:52px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.sbtn:hover{box-shadow:0 0 0 4px rgba(var(--rgb),.4)}
.sbtn:active{transform:scale(.98)}
.sbtn svg{width:22px;height:22px;flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);margin:0 0 18px;font-size:.9em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.seg button{font:inherit;font-weight:800;color:#fff;background:#000;border:2px solid #3a3a44;border-radius:12px;min-height:48px;cursor:pointer;transition:border-color .2s,background .2s}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:rgba(var(--rgb),.16)}
.fld{display:block;margin-bottom:14px}
.fld>span,.fld>label{display:block;font-weight:600;margin-bottom:6px}
.fld input{width:100%;font:inherit;color:#fff;background:#000;border:2px solid #3a3a44;border-radius:12px;padding:12px 14px;min-height:52px}
.fld input:focus-visible{border-color:var(--light)}
.pw{position:relative}
.pw input{padding-right:110px}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;font:inherit;font-weight:600;color:#fff;background:#16161b;border:0;border-radius:8px;padding:0 12px;cursor:pointer}
.err{color:#ff9b9b;min-height:1.4em;margin:0 0 12px;font-size:.92em;line-height:1.4}
.linkbtn{font:inherit;color:var(--light);background:none;border:0;padding:10px 4px;cursor:pointer;text-decoration:underline;margin-top:8px}
.main{flex:1;min-width:0;padding:32px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:rgba(11,11,13,.85);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:130px}
.card span{color:var(--muted);font-size:.9em}
.sgroup{max-width:560px;margin-bottom:28px}
.sgroup .opts{margin-bottom:0}
.sum div{padding:4px 0}
.sum b{color:var(--light)}
.nav.prof{display:flex;align-items:center;gap:12px;margin-top:auto;padding:8px 12px;min-height:56px}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--light),var(--accent) 55%,var(--dark));background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:calc(var(--fs)*.85)}
.av.guest{background:#2a2a31;color:#b9b9c4}
.av.img{color:transparent}
.av.big{width:84px;height:84px;font-size:2em}
.av svg{width:60%;height:60%}
.wlang{position:absolute;top:16px;right:16px;z-index:2}
.wlang .opts{display:flex;gap:8px;margin:0}
.wlang .opt{min-height:44px;padding:8px 14px}
.pcard{display:flex;align-items:center;gap:18px;max-width:480px;margin-bottom:18px;background:rgba(11,11,13,.85);border:1px solid var(--line);border-radius:14px;padding:20px}
.pcard h3{margin:0 0 4px;font-size:1.2em;overflow-wrap:anywhere}
.pmeta{color:var(--muted);font-size:.9em}
.pedit{max-width:480px}
.pnote{max-width:480px;margin-bottom:18px}
.rowb{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fld input:disabled{opacity:.5}
.err.ok{color:var(--light)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pill{border:2px solid #6b6b78;border-radius:999px;padding:6px 14px;font-weight:600}
.pill.ok{border-color:var(--accent)}
.chc{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:#fff;cursor:pointer}
.chc:hover{border-color:var(--accent)}
.chn{display:flex;flex-direction:column;gap:2px;min-width:0}
.chn span{color:var(--muted);font-size:.85em}
.prev{max-width:560px;margin-bottom:18px}
.prev div{padding:3px 0}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:880px;margin-top:12px}
.ctl input[type=range]{accent-color:var(--accent);min-height:44px}
#cSeek{flex:1;min-width:160px}
#cVol{width:110px}
.ctl .btn{padding:10px 18px;min-height:48px}
#cLag:empty{display:none!important}
.pl:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;padding:12px}
.pl:fullscreen #vid{width:100%;max-width:none;aspect-ratio:auto;flex:1;min-height:0;border:0;border-radius:0}
.pl:fullscreen .ctl{max-width:none}
#vid{width:100%;max-width:880px;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:12px}
@media (max-width:700px){.nav.prof{padding:4px;justify-content:center}.pname{display:none}}
@media (max-width:700px){.sidebar{width:72px}.sidebar .nav{font-size:0}.sidebar .nav::first-letter{font-size:var(--fs)}.main{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
body.calm *,body.calm *::before,body.calm *::after{transition-duration:.01s!important;transition-delay:0s!important}
body.calm .step.on{animation:none}
</style>
</head>

    <section class="view" id="setup">
      <div class="setup">
        <div class="progress" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></div>
        <div class="step on"><h2 data-i="st_acct"></h2><p data-i="st_acct_d"></p>
